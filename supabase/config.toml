project_id = "packsmart"

# 管理員函式要求 MFA（aal2）；本機與雲端都要開啟 TOTP。
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# App 以 6 位數驗證碼登入（不處理登入連結），信件必須包含 {{ .Token }}。
# 免費方案的預設寄信不能改範本；設定自訂 SMTP 後，`supabase config push` 才套用得到這份內容。
[auth.email]
otp_length = 6

[auth.email.template.magic_link]
subject = "PackSmart 登入驗證碼"
content_path = "./supabase/templates/login-code.html"

[auth.email.template.confirmation]
subject = "PackSmart 登入驗證碼"
content_path = "./supabase/templates/login-code.html"

# 兩個函式都在程式內自行驗證 token（getUser／以呼叫者身分呼叫 RPC），支援新版簽章金鑰。
[functions.delete-account]
verify_jwt = false

[functions.admin-delete-user]
verify_jwt = false
