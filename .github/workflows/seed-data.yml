name: Seed data

# 品質閘門：
#   push / PR 修改 SeedData 時：schema 與一致性錯誤會擋下；逾期只標警告，不擋無關的改動。
#   每週排程與手動執行：逾期視為失敗（GitHub 會寄失敗通知），並檢查開放資料是否有更新。
#   push 到 main 且檢查通過後：清除 jsDelivr 快取，App 下次啟動就能取得新資料。

on:
  push:
    branches: [main]
    paths:
      - "TravelGenius/Resources/SeedData/**"
      - "schemas/**"
      - "scripts/validate_seed.py"
      - "scripts/fetch_reference.py"
      - "scripts/requirements.txt"
      - ".github/workflows/seed-data.yml"
  pull_request:
    paths:
      - "TravelGenius/Resources/SeedData/**"
      - "schemas/**"
      - "scripts/validate_seed.py"
      - "scripts/fetch_reference.py"
      - "scripts/requirements.txt"
      - ".github/workflows/seed-data.yml"
  schedule:
    - cron: "0 1 * * 1" # 每週一 09:00（台北時間）
  workflow_dispatch:
    inputs:
      max_age_months:
        description: "lastVerified 允許的最大月數"
        required: false
        default: "6"

permissions:
  contents: read

concurrency:
  group: seed-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Schema、一致性、逾期檢查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: 安裝相依套件
        run: pip install -r scripts/requirements.txt

      - name: 驗證 SeedData
        env:
          EVENT_NAME: ${{ github.event_name }}
          MAX_AGE_MONTHS: ${{ inputs.max_age_months || '6' }}
        run: |
          args=(--max-age-months "$MAX_AGE_MONTHS")
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            args+=(--fail-on-stale)
          fi
          python scripts/validate_seed.py "${args[@]}"

  upstream-drift:
    name: 開放資料是否有更新
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 比對 countries.json 與 cities.json
        run: python scripts/fetch_reference.py --check

  purge-cdn:
    name: 清除 jsDelivr 快取
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 通知 jsDelivr 重新抓取 SeedData
        run: |
          for name in countries cities packing_rules prohibited_items aviation_rules etiquette; do
            url="https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/TravelGenius/Resources/SeedData/${name}.json"
            status=$(curl -fsS --retry 3 "$url" | python3 -c 'import json, sys; print(json.load(sys.stdin)["status"])')
            echo "${name}: ${status}"
          done
